<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Mirai - Watch Anime Online, Free Anime Streaming</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./favicon-180.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./New.css">
    <link rel="stylesheet" href="./site-bottom-button.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css" integrity="sha512-YWzhKL2whUzgiheMoBFwW8CKV4qpHQAEuvilg9FAn5VJUDwKZZxkJNuGM4XkWuk94WCrrwslk8yWNGmY1EduTA==" crossorigin="anonymous" referrerpolicy="no-referrer" /></head>
<body>
    <header>
    <nav>
           <ul class='nav-bar'>
                <input type='checkbox' id='check' />
                <label for="check" class="open-menu"><i class="fas fa-bars"></i></label>
                <label for="check" class="close-menu"><i class="fas fa-times"></i></label>

                <li class='logo'>
                    <a href='home.html'><img src='logo.png' alt="Logo"/></a>
                </li>

                <li class="nav-search-item">
                    <div class="search-wrap">
                        <span class="search-icon" id="animeSearchBtn" style="cursor: pointer;"><i class="fas fa-search"></i></span>
                        <input type="text" id="animeSearchBox" placeholder="Search anime...">
                        <kbd class="search-shortcut">Ctrl Y</kbd>
                    </div>
                </li>

                <span class="menu">
                    <li>
                     <a href="home.html">Home</a></li>
                    <li class="nav-dropdown">
                                  <a href="#" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">
                                 Genre <i class="fas fa-angle-down"></i>
                           </a>
                          <ul class="dropdown-menu">
                            <li><button class="genre-link" data-genre="Action">Action</button></li>
                            <li><button class="genre-link" data-genre="Adventure">Adventure</button></li>
                            <li><button class="genre-link" data-genre="Comedy">Comedy</button></li>
                            <li><button class="genre-link" data-genre="Drama">Drama</button></li>
                            <li><button class="genre-link" data-genre="Ecchi">Ecchi</button></li>
                            <li><button class="genre-link" data-genre="Fantasy">Fantasy</button></li>
                            <li><button class="genre-link" data-genre="Horror">Horror</button></li>
                            <li><button class="genre-link" data-genre="Mahou Shoujo">Magical Girl</button></li>
                            <li><button class="genre-link" data-genre="Mecha">Mecha</button></li>
                            <li><button class="genre-link" data-genre="Music">Music</button></li>
                            <li><button class="genre-link" data-genre="Mystery">Mystery</button></li>
                            <li><button class="genre-link" data-genre="Psychological">Psychological</button></li>
                            <li><button class="genre-link" data-genre="Romance">Romance</button></li>
                            <li><button class="genre-link" data-genre="Sci-Fi">Sci-Fi</button></li>
                            <li><button class="genre-link" data-genre="Slice of Life">Slice of Life</button></li>
                            <li><button class="genre-link" data-genre="Sports">Sports</button></li>
                            <li><button class="genre-link" data-genre="Supernatural">Supernatural</button></li>
                            <li><button class="genre-link" data-genre="Thriller">Thriller</button></li>
                        </ul>
                    </li>
                    <li class="nav-dropdown">
                        <a href="#" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">
                            Types <i class="fas fa-angle-down"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li><button type="button" class="types-link" data-type="TV">TV Series</button></li>
                            <li><button type="button" class="types-link" data-type="MOVIE">Movies</button></li>
                            <li><button type="button" class="types-link" data-type="OVA">OVAs</button></li>
                            <li><button type="button" class="types-link" data-type="ONA">ONAs</button></li>
                            <li><button type="button" class="types-link" data-type="SPECIAL">Specials</button></li>
                            <li><button type="button" class="types-link" data-type="MUSIC">Music</button></li>
                        </ul>
                    </li>
                    <li><a href="history.html"><i class="fas fa-history"></i> History</a></li>
                    <li><a href="my-list.html"><i class="fas fa-list"></i> My List</a></li>
                    <li><a href="updates.html">Updated</a></li>
                    <li><a href="">Feedback</a></li>
                </span>
            </ul>
        </nav>
    </header>

    <div class="alert-banner">
        <div class="alert-content">
            <i class="fas fa-circle-info"></i>
            <span>If Server 1 isn't responsive, switch to an alternate server below for continuous streaming.</span>
        </div>
    </div>

    <main class="watch-wrapper">
        <div class="main-content">
            <section class="player-container">
                <div class="video-ratio-box">
                    <iframe id="videoPlayer" src="about:blank" allowfullscreen allow="autoplay; encrypted-media" title="Anime Video Player"></iframe>
                </div>
                <div class="server-selection">
                    <span class="server-label"><i class="fas fa-server"></i> Servers:</span>
             <div class="auto-next-wrap">
        <label class="auto-next-label">
            <input type="checkbox" id="autoNextToggle" class="auto-next-checkbox" checked>
            <span class="custom-checkbox"></span>
            <span>Auto Next</span>

            <button class="server-btn" id="theaterToggleBtn" onclick="toggleTheaterMode()">
           <i class="fas fa-expand-alt"></i> Theater Mode
            </button>
        </label>
    </div>         <div class="server-buttons" id="serverButtonContainer" role="radiogroup" aria-label="Choose streaming server">
                      <button id="btn-server1" class="server-btn">Server 1</button>
                        <button id="btn-server2" class="server-btn">Server 2</button>
                        <button id="btn-server3" class="server-btn">Server 3</button>
                        <button id="btn-server4" class="server-btn">Server 4</button>
                        <button id="btn-server5" class="server-btn">Server 5</button>
                        <button id="btn-server6" class="server-btn">Server 6</button>
                   </div>
                 </div>
             </section>

            <section class="anime-metadata" aria-labelledby="animeTitleHeader">
                    <div class="metadata-top">
                    <a id="backToDetails" href="#" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
                    <div class="metadata-info">
                        <h1 id="animeTitleHeader" class="anime-title">Loading Anime...</h1>
                        <h2 id="episodeIndicator" class="episode-indicator">Episode --</h2>
                    </div>
                </div>
                <p id="animeDescription" class="anime-description"></p>
            </section>
        </div>

        <aside class="sidebar-content" aria-labelledby="episodeListHeader">
            <div class="sidebar-header">
                <h3 id="episodeListHeader" class="sidebar-title">Episodes</h3>
                <span class="episode-count" id="episodeCount">0 episodes</span>
            </div>
            <div class="episode-search">
                <i class="fas fa-search"></i>
                <input type="text" id="episodeSearch" placeholder="Search episodes...">
            </div>
            <button class="jump-current-btn" id="jumpCurrentBtn"><i class="fas fa-location-arrow"></i> Current Episode</button>
            <div class="episode-list-scroll">
                <nav class="episode-list" id="episodeListContainer" aria-label="Episode navigation selection">
                </nav>
            </div>
        </aside>
    </main>

    <script src="api.js"></script>
    <script src="script.js"></script>
    <script src="site-bottom-button.js"></script>
</body>
</html>
