<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mirai - Watch Anime Online, Free Anime Streaming</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./favicon-180.png">

    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="site-bottom-button.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="brand">
        <img src="mirai-logo.png" alt="Mirai Anime">
    </div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue watching on Mirai 🚀</p>

    <p class="error-msg" id="errorMsg">Please fill in your email and password.</p>

    <form id="loginForm">

        <div class="group">
            <label>Email Address</label>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="john@example.com" required>
            </div>
        </div>

        <div class="group">
            <label>Password</label>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="******" required>
            </div>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit">
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
        </button>

    </form>

    <p class="or">or sign in with</p>

    <div class="social">
        <button type="button">
            <i class="fa-brands fa-google"></i>
            Google
        </button>

        <button type="button">
            <i class="fa-brands fa-discord"></i>
            Discord
        </button>
    </div>

    <div class="bottom">
        Don't have an account?
        <a href="register.html">Create one</a>
    </div>

    <a href="#" class="skip-link" id="guestLink"><i class="fa-solid fa-user"></i> Continue as Guest</a>

</div>

<script>
    function getUsers() {
        try { return JSON.parse(localStorage.getItem('mirai_users')) || []; }
        catch { return []; }
    }

    function findUser(email) {
        return getUsers().find(u => u.email.toLowerCase() === email.toLowerCase());
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!email || !password) {
            errorMsg.textContent = 'Please fill in your email and password.';
            errorMsg.style.display = 'block';
            return;
        }

        const user = findUser(email);

        if (!user) {
            errorMsg.textContent = 'No account found with this email. Please register first.';
            errorMsg.style.display = 'block';
            return;
        }

        if (user.password !== password) {
            errorMsg.textContent = 'Incorrect password. Please try again.';
            errorMsg.style.display = 'block';
            return;
        }

        errorMsg.style.display = 'none';

        localStorage.setItem('mirai_current_user', email);
        window.location.href = 'home.html';
    });

    document.getElementById('guestLink').addEventListener('click', function (e) {
        e.preventDefault();
        localStorage.removeItem('mirai_current_user');
        window.location.href = 'home.html';
    });
</script>
<script src="site-bottom-button.js"></script>

</body>
</html>
